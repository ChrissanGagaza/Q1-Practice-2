<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1Practice 2</title>
    <style>

    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <div class="container1">
            <h1>Login</h1>
            <img src="https://cdn-icons-png.flaticon.com/512/152/152533.png" alt="login logo">
        </div>
        <br>

        <div class="container2">
            <form action="">
                <span id="label>"><label for="uname">Username:</label></span>
                <br>
                <input type="email" id="uname" name="uname" placeholder="e.g. name@gmail.com" required>
                <br><br>

                <span id="label>"><label for="password">Password:</label></span>
                <br>
                <input type="password" id="pword" name="pword" placeholder="e.g. l2EASG7B9o!" required>
                <br><br>

                <button type="submit" id="btn" name="btn">Login</button>
                <input type="reset" id="cancel" name="cancel" value="Cancel">
            </form>
        </div>
    </div>
</body>
</html>
